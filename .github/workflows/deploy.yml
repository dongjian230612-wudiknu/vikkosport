name: Deploy VikkoSport to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "dist/,package.json"
          target: "/home/ubuntu/vikkosport"
          strip_components: 0

      - name: Restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/vikkosport
            test -d dist
            pm2 delete vikkosport 2>/dev/null || true
            # Use PM2 built-in static server (no global npm install / sudo needed)
            pm2 serve /home/ubuntu/vikkosport/dist 3001 --spa --name vikkosport
            pm2 save
            sleep 2
            pm2 describe vikkosport | grep -q "status.*online"
            curl -sf http://127.0.0.1:3001/ >/dev/null
            echo "vikkosport healthy on :3001"
